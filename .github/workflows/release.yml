name: LibGDX Release CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # JAVA
      # ==========================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ==========================================
      # VERSION
      # ==========================================

      - name: Determine Version
        id: version
        shell: bash
        run: |
          # ==========================================
          # CHANGE THESE WHEN STARTING A NEW VERSION
          # ==========================================

          MAJOR=1
          MINOR=0

          # ==========================================
          # Find latest tag for this major.minor
          # ==========================================

          LATEST_TAG=$(git tag -l "v${MAJOR}.${MINOR}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST_TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')
            PATCH=$((PATCH + 1))
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          # Android versionCode
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))

          echo "Version: $VERSION"
          echo "Tag: $TAG"
          echo "Version Code: $VERSION_CODE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # ==========================================
      # CREATE GIT TAG
      # ==========================================

      - name: Create Git Tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

      # ==========================================
      # BUILD DESKTOP JAR
      # ==========================================

      - name: Build Desktop
        run: |
          ./gradlew lwjgl3:jar


      # -----------------------------------------
      # SIGNING
      # -----------------------------------------

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > android/keystore.jks

      # ==========================================
      # BUILD ANDROID APK
      # ==========================================

      - name: Build Android APK
        env:
          SIGNING_STORE_FILE: keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew
            android:assembleRelease \
            android:bundleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }}

      # ==========================================
      # RENAME ARTIFACTS
      # ==========================================

      - name: Prepare Release Files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release

          # Find the desktop JAR
          DESKTOP_JAR=$(find lwjgl3/build/libs -maxdepth 1 -type f -name "*.jar" | head -n 1)

          if [ -z "$DESKTOP_JAR" ]; then
            echo "Desktop JAR not found!"
            exit 1
          fi

          cp "$DESKTOP_JAR" "release/Echo-demo-${VERSION}-desktop.jar"

          # Find Android APK
          APK=$(find android/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Android APK not found!"
            exit 1
          fi

          cp "$APK" "release/Echo-demo-${VERSION}-android.apk"

          echo "Release files:"
          ls -lh release

      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/Echo-demo-${{ steps.version.outputs.version }}-desktop.jar
            release/Echo-demo-${{ steps.version.outputs.version }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
